name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: fmt · clippy · test · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml; caches the registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: sqlx offline artifact is current
        # prepare --check validates the committed .sqlx cache against a real
        # schema, so it needs a live DB (SQLX_OFFLINE is for the cached build,
        # not for prepare itself).
        env:
          DATABASE_URL: sqlite:ci.db
          SQLX_OFFLINE: "false"
        run: |
          cargo install sqlx-cli --no-default-features --features sqlite --locked
          sqlx database create
          sqlx migrate run --source migrations
          cargo sqlx prepare --check --workspace -- --all-targets

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  frontend:
    name: prettier · eslint · svelte-check · vitest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:run
      - run: npm run build
      - run: npm run bundle:check

  e2e:
    name: playwright · mock screens (chromium, webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: activity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
      - run: npm run e2e:check
      # The browsers, and the system libraries WebKit needs that the runner
      # image lacks.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e:mock
      # Screenshot baselines depend on the OS's fonts and only the macOS set
      # is committed, so nothing is compared here: each screen's picture goes
      # to test-results/gallery for a person to look through. The line
      # reporter leaves the HTML report of the step above as it is.
      - name: screenshot gallery
        if: ${{ !cancelled() }}
        run: npm run e2e:visual -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: activity/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-screenshots
          path: activity/test-results/gallery/
          retention-days: 14

  e2e-app:
    name: playwright · real API (chromium, webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml; caches the registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # leaf-server's `e2e_server` example: the real API over a seeded
      # database, with stand-ins for Discord and R2. Playwright starts it with
      # `cargo run`; building it here first makes a compile error a step of
      # its own and leaves Playwright nothing to wait for.
      - name: build the e2e server
        run: cargo build -p leaf-server --example e2e_server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
        working-directory: activity
      - run: npx playwright install --with-deps chromium webkit
        working-directory: activity
      # Builds the Activity for the e2e server, starts one server per engine
      # and runs the suites under e2e/app. Nothing in it reaches Discord, R2
      # or any other machine.
      - run: npm run e2e:app
        working-directory: activity
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-app
          path: activity/playwright-report/
          retention-days: 14

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
