# The one supported deployment (see guide/README.md):
# leaf (bot + server, one process) + Cloudflare Tunnel sidecar.
#
# First run: `docker compose up`, then open http://localhost:3777/setup and
# enter the setup code from the logs. Credentials go in that page, never in
# env vars.

services:
  leaf:
    build: .
    container_name: leaf
    restart: unless-stopped
    ports:
      - "3777:3777" # local access to setup page / API; the tunnel covers public
    volumes:
      - leaf-data:/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Development only: a server id here registers the commands in that one
      # server instead of globally. Leave it unset for a real install
      # (guide/01-install.md, "Command registration and DEV_GUILD_ID").
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
    stop_grace_period: 30s

  # Cloudflare Tunnel: publishes leaf at your domain without port forwarding.
  # Set TUNNEL_TOKEN in a .env file next to this compose file, then:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: leaf-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # Required when the tunnel profile is active; cloudflared exits
      # immediately without it.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - leaf

volumes:
  leaf-data:
