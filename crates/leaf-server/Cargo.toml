[package]
name = "leaf-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "leaf HTTP server: bootstrap setup UI, REST API, media proxy, embedded app hosting"

[dependencies]
leaf-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
object_store.workspace = true
bytes.workspace = true
chrono.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
moka.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
# The e2e example logs the way the real binary does.
tracing-subscriber.workspace = true

# The real API over a seeded temp database, an in-memory object store and a
# stub Discord, for the browser suites (see the file's own doc comment).
# `test = true` runs the example's own tests under `cargo test`.
[[example]]
name = "e2e_server"
path = "examples/e2e_server/main.rs"
test = true

[lints]
workspace = true
