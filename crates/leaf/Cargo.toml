[package]
name = "leaf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "leaf: composition root — one process running leaf-server and (in run mode) leaf-bot"

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
leaf-core.workspace = true
leaf-bot.workspace = true
leaf-server.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `leaf doctor` (src/doctor.rs): its HTTP client, the read-only look at the
# database, the temp dir a database copy is migrated in, and its JSON output.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true

[dev-dependencies]
# tests/doctor_cli.rs serves the real router over an in-memory store, and
# reads and writes pipes and sockets by hand.
object_store.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
